name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . && python -m pip install pytest ruff
      - name: Lint
        run: ruff check . || true   # lint is advisory until the tree is cleaned
      - name: Tests
        run: python -m pytest -q tests
      - name: Benchmark smoke (L0 latency, asserts tier/verdict)
        run: python benchmarks/decision_latency.py --n 50
